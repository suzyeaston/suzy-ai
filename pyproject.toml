[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suzy-ai"
version = "0.3.0"
description = "Local-first open-source intelligence core for creative machines and cultural interpretation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Suzy Easton" }
]
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
live = ["sounddevice>=0.5,<0.6"]

[project.scripts]
suzy-ai = "suzy_ai.cli:main"

[tool.setuptools.packages.find]
include = ["suzy_ai*"]

[tool.setuptools.package-data]
"suzy_ai.music" = ["stage_panel.html"]
