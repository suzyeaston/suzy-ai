name: Futureproof one-open Mac stage app

on:
  pull_request:
    paths:
      - "apps/futureproof-stage/**"
      - "plugins/suzy-toast/**"
      - ".github/workflows/futureproof-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-mac-app:
    runs-on: macos-15
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          xcodebuild -version
          swiftc --version
          python3 --version
          cmake --version
      - name: Generate deterministic offline stage backing
        run: |
          SUZY_BACKING_DIR="$RUNNER_TEMP/futureproof/backing" python3 apps/futureproof-stage/generate_backing.py
          ls -lh "$RUNNER_TEMP/futureproof/backing/"
      - name: Build native SUZY Toast effect
        run: |
          cmake -S plugins/suzy-toast -B "$RUNNER_TEMP/futureproof-au" -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cmake --build "$RUNNER_TEMP/futureproof-au" --config Release --target SuzyToast_AU -j 2
      - name: Compile Apple Silicon Futureproof standalone host
        run: |
          mkdir -p "$RUNNER_TEMP/futureproof/SUZY TOAST Futureproof.app/Contents/MacOS"
          swiftc -O -parse-as-library -target arm64-apple-macosx14.0 \
            -framework AppKit -framework SwiftUI -framework AVFoundation \
            -framework CoreMIDI -framework AudioToolbox \
            apps/futureproof-stage/StageApp.swift \
            -o "$RUNNER_TEMP/futureproof/SUZY TOAST Futureproof.app/Contents/MacOS/Futureproof"
      - name: Assemble signed test bundle and offline audio
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/futureproof/SUZY TOAST Futureproof.app"
          RES="$APP/Contents/Resources"
          mkdir -p "$RES"
          cp "$RUNNER_TEMP/futureproof/backing/"*.wav "$RES/"
          COMPONENT="$(find "$RUNNER_TEMP/futureproof-au" -type d -name '*.component' -print -quit)"
          if [ -z "$COMPONENT" ]; then echo "::error::No AU component produced"; exit 1; fi
          ditto "$COMPONENT" "$RES/SUZY Toast.component"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Futureproof</string>
          <key>CFBundleIdentifier</key><string>ca.suzyeaston.futureproofstage</string>
          <key>CFBundleName</key><string>SUZY TOAST Futureproof</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSMicrophoneUsageDescription</key><string>Listen to your microphone or VE-22 through the selected system audio input when enabled.</string>
          <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --sign - "$RES/SUZY Toast.component"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/Futureproof"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/SUZY-TOAST-Futureproof-macOS-arm64.zip"
          unzip -l "$RUNNER_TEMP/SUZY-TOAST-Futureproof-macOS-arm64.zip" | grep -E 'Futureproof$|pyramid.wav|fishes.wav|evolve.wav|Info.plist' | head -20
      - name: Upload one-open test app
        uses: actions/upload-artifact@v4
        with:
          name: SUZY-TOAST-Futureproof-one-open-macOS-arm64
          path: ${{ runner.temp }}/SUZY-TOAST-Futureproof-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
