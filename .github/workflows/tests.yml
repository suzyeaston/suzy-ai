name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash scripts/test-native-loop.sh
      - run: bash scripts/test.sh
      - run: node --test tests/toaster_loop_rack.test.cjs
      - run: bash -n scripts/setup-mac.sh scripts/start-mac.sh
  mac-companion:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and compile Mac companion
        working-directory: apps/macos
        run: swift test
      - name: Build signed local app bundle
        run: bash scripts/build-mac-companion.sh
      - name: Check launch scripts
        run: bash -n scripts/build-mac-companion.sh scripts/start-mac-companion.sh
