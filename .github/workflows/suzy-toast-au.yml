name: SUZY Toast AU engine + macOS build

on:
  pull_request:
    paths:
      - "plugins/suzy-toast/**"
      - ".github/workflows/suzy-toast-au.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile JUCE-free native looping tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            plugins/suzy-toast/tests/loop_buffer_test.cpp -o /tmp/toast-loop-test
      - name: Run audio buffer contract QA
        run: /tmp/toast-loop-test
      - name: Validate three musical performance scenes
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            plugins/suzy-toast/tests/performance_scene_test.cpp -o /tmp/toast-scenes-test
          /tmp/toast-scenes-test

  au-macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and CMake versions
        run: |
          xcodebuild -version
          cmake --version
      - name: Configure pinned JUCE Audio Unit, arm64 target
        run: cmake -S plugins/suzy-toast -B /tmp/suzy-toast-au -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Compile native Audio Unit
        run: cmake --build /tmp/suzy-toast-au --target SuzyToast_AU --config Release -j 2
      - name: Find AU bundle
        run: find /tmp/suzy-toast-au -name "*.component" -print

      - name: Package compiled AU for manual Mac test
        shell: bash
        run: |
          component="$(find /tmp/suzy-toast-au -type d -name '*.component' -print -quit)"
          if [ -z "$component" ]; then
            echo "::error::No Audio Unit component produced"
            exit 1
          fi
          echo "Packaging $component"
          ditto -c -k --sequesterRsrc --keepParent "$component" "$GITHUB_WORKSPACE/suzy-toast-au-macos-arm64.zip"
          unzip -l "$GITHUB_WORKSPACE/suzy-toast-au-macos-arm64.zip" | head -n 20
      - name: Upload test AU (unsigned/ad-hoc build)
        uses: actions/upload-artifact@v4
        with:
          name: suzy-toast-au-macos-arm64
          path: suzy-toast-au-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
